<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="restaurantdashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>restaurantdashboard</title>
  <link rel="manifest" href="manifest.json">

  <!-- Version Check + FCM Service Worker -->
  <script>
    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        var base = document.querySelector('base');
        var baseHref = base ? base.getAttribute('href') : '/';
        if (!baseHref.endsWith('/')) baseHref += '/';
        navigator.serviceWorker.register(baseHref + 'firebase-messaging-sw.js');
      }

      fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.json())
        .then(data => {
          const current = localStorage.getItem('app_version');
          if (current && current !== data.version) {
            localStorage.setItem('app_version', data.version);
            window.location.reload(true);
          } else if (!current) {
            localStorage.setItem('app_version', data.version);
          }
        })
        .catch(err => console.log('Version check failed:', err));
    });
  </script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
